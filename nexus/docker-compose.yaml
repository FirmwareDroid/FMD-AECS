version: '3.7'
services:
  nexus:
    platform: "linux/amd64"
    image: sonatype/nexus3
    restart: unless-stopped
    env_file:
      - ./.env
    volumes:
      - ${NEXUS_REPOSITORY_PATH}:/nexus-data
    ports:
      - "8081:8081"
      - "8082:8082"

# On linux: sudo chown -R 200:200 ./nexus_data