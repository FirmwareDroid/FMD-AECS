static_resources:
  listeners:
  - name: listener_0
    address:
      socket_address: { address: 0.0.0.0, port_value: 443 }
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: ingress_http
          codec_type: AUTO
          route_config:
            name: local_route
            virtual_hosts:
            - name: local_service
              domains: ["*"]
              routes:
              - match:
                  prefix: "/0/"
                route:
                  cluster: emulator_service_grpc_0
                  timeout: 0s
                  prefix_rewrite: "/"
                  max_stream_duration:
                      grpc_timeout_header_max: 0s
              - match:
                  prefix: "/1/"
                route:
                  cluster: emulator_service_grpc_1
                  timeout: 0s
                  prefix_rewrite: "/"
                  max_stream_duration:
                      grpc_timeout_header_max: 0s
              - match:
                  prefix: "/2/"
                route:
                  cluster: emulator_service_grpc_2
                  timeout: 0s
                  prefix_rewrite: "/"
                  max_stream_duration:
                      grpc_timeout_header_max: 0s
              cors:
                allow_origin_string_match:
                  - safe_regex:
                      google_re2: {}
                      regex: ".*"
                allow_methods: GET, PUT, DELETE, POST, OPTIONS
                allow_headers: keep-alive,user-agent,cache-control,content-type,content-transfer-encoding,custom-header-1,x-accept-content-transfer-encoding,x-accept-response-streaming,x-user-agent,x-grpc-web,grpc-timeout,authorization
                max_age: "1728000"
                expose_headers: custom-header-1,grpc-status,grpc-message
          http_filters:
          - name: envoy.filters.http.cors
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.Cors
          - name: envoy.filters.http.grpc_web
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.grpc_web.v3.GrpcWeb
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
      transport_socket:
        name: envoy.transport_sockets.tls
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
          common_tls_context:
            tls_certificates:
            - certificate_chain: {filename: "/etc/envoy/certs/certificate.pem"}
              private_key: {filename: "/etc/envoy/certs/privkey.pem"}

  clusters:

  - name: emulator_service_grpc_0
    connect_timeout: 0.250s
    type: STRICT_DNS
    lb_policy: ROUND_ROBIN
    http2_protocol_options: {}
    load_assignment:
      cluster_name: emulator_service_grpc_0
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: android_emulator_0
                port_value: 8554

  - name: emulator_service_grpc_1
    connect_timeout: 0.250s
    type: STRICT_DNS
    lb_policy: ROUND_ROBIN
    http2_protocol_options: {}
    load_assignment:
      cluster_name: emulator_service_grpc_1
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: android_emulator_1
                port_value: 8555

  - name: emulator_service_grpc_2
    connect_timeout: 0.250s
    type: STRICT_DNS
    lb_policy: ROUND_ROBIN
    http2_protocol_options: {}
    load_assignment:
      cluster_name: emulator_service_grpc_2
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: android_emulator_2
                port_value: 8556
